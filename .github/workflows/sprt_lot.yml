name: SPRT en lot
run-name: ${{ inputs.nom }} (vague ${{ inputs.vague }}, ${{ inputs.morceaux }} morceaux)

# Un meme SPRT reparti sur plusieurs machines : chaque morceau joue un nombre
# fixe de paires (sans arret anticipe), puis le bilan additionne les comptes
# pentanomiaux et calcule le LLR (sur le PC, par ci/bilan_lot.py : un
# travail de bilan ici attendrait une machine libre derriere les autres tests). Si le test n'a pas conclu, on lance la vague
# suivante (meme nom, vague+1) : ci/bilan_lot.py additionne toutes les vagues.
#   bash ci/sprt_lot.sh Nom "Opt=1" [morceaux] [parties par morceau] [vague]
on:
  workflow_dispatch:
    inputs:
      nom:
        description: "nom du test"
        required: true
      opt1:
        description: "options UCI du candidat"
        required: false
        default: ""
      opt2:
        description: "options UCI de la reference"
        required: false
        default: ""
      mode:
        description: "nodes, ou tc:10+0.1"
        required: false
        default: "nodes"
      morceaux:
        description: "nombre de machines"
        required: false
        default: "8"
      parties:
        description: "parties par morceau"
        required: false
        default: "2000"
      vague:
        description: "numero de vague (change les ouvertures)"
        required: false
        default: "1"
      bornes:
        description: "elo0 elo1 du SPRT"
        required: false
        default: "0 5"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      liste: ${{ steps.l.outputs.liste }}
    steps:
      - id: l
        run: echo "liste=[$(seq -s, 1 ${{ inputs.morceaux }})]" >> "$GITHUB_OUTPUT"

  morceau:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        m: ${{ fromJSON(needs.plan.outputs.liste) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install chess
      - name: morceau
        env:
          NOM: ${{ inputs.nom }}
          OPT1: ${{ inputs.opt1 }}
          OPT2: ${{ inputs.opt2 }}
          MODE: ${{ inputs.mode }}
          PARTIES: ${{ inputs.parties }}
          VAGUE: ${{ inputs.vague }}
          MORCEAU: ${{ matrix.m }}
        run: bash ci/morceau_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etat-${{ inputs.nom }}-v${{ inputs.vague }}-m${{ matrix.m }}
          path: ci_out/

