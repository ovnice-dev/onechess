name: Autojeu en lot
run-name: Autojeu (${{ inputs.morceaux }} machines, graine ${{ inputs.graine }})

# Donnees d'entrainement du reseau d'Onechess : Stockfish 19 contre lui-meme,
# 5 000 noeuds par coup, positions calmes etiquetees par le score de recherche
# (tools/datagen.py, comme sur Kaggle). Chaque machine a sa graine
# (graine + 100 x morceau) ; le PC rapatrie les .bin dans data/autojeu/.
on:
  workflow_dispatch:
    inputs:
      morceaux:
        required: false
        default: "10"
      graine:
        required: true
      minutes:
        description: "duree de generation par machine"
        required: false
        default: "330"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      liste: ${{ steps.l.outputs.liste }}
    steps:
      - id: l
        run: echo "liste=[$(seq -s, 1 ${{ inputs.morceaux }})]" >> "$GITHUB_OUTPUT"

  morceau:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        m: ${{ fromJSON(needs.plan.outputs.liste) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install chess
      - name: stockfish 19
        run: |
          curl -sL -o sf.tgz https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz
          mkdir sf && tar xzf sf.tgz -C sf
          SF=$(find "$PWD/sf" -type f -name 'stockfish*' -perm -u+x | head -1)
          echo "uci" | "$SF" | head -1
          echo "SF=$SF" >> "$GITHUB_ENV"
      - name: autojeu
        run: |
          mkdir -p ci_out
          G=$(( ${{ inputs.graine }} + 100 * ${{ matrix.m }} ))
          ( sleep $(( ${{ inputs.minutes }} * 60 )); touch ci_out/STOP ) &
          python -u tools/datagen.py --engine "$SF" --openings "$PWD/data/openings.epd" \
            --out "$PWD/ci_out" --positions 1000000000 --workers "$(nproc)" --nodes 5000 \
            --hash 16 --seed "$G" --stop-file "$PWD/ci_out/STOP" | awk 'NR < 30 || NR % 60 == 0 || /termine|rror/'
          rm -f ci_out/STOP
          ls -la ci_out
      - uses: actions/upload-artifact@v4
        with:
          name: autojeu-g${{ inputs.graine }}-m${{ matrix.m }}
          path: ci_out/*.bin
          retention-days: 7
